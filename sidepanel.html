<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Flow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    small {
      color: #8b949e;
      font-size: 11px;
    }

    /* Connection status */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 16px;
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .status-dot.disconnected { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.5); }
    .status-dot.checking { background: #eab308; animation: pulse 1.5s infinite; }

    /* Form elements */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #e6edf3;
      padding: 10px 12px;
      font-size: 12px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #3b82f6;
    }
    textarea::placeholder {
      color: #484f58;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .row > div { flex: 1; }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #e6edf3;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus, input[type="number"]:focus {
      border-color: #3b82f6;
    }
    select option {
      background: #161b22;
      color: #e6edf3;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      outline: none;
      margin-top: 8px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(59,130,246,0.5);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-start {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }
    .btn-start:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59,130,246,0.35); }
    .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      display: none;
    }
    .btn-stop:hover { box-shadow: 0 4px 12px rgba(239,68,68,0.3); }

    .btn-retry {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      display: none;
    }
    .btn-retry:hover { box-shadow: 0 4px 12px rgba(249,115,22,0.3); }
    .btn-retry:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-clear {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #e6edf3;
      margin-top: 8px;
    }
    .btn-clear:hover { background: rgba(255,255,255,0.1); }

    .btn-export {
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.3);
      color: #22c55e;
      display: none;
      font-size: 11px;
      padding: 6px 10px;
      margin-top: 0;
    }
    .btn-export:hover { background: rgba(34,197,94,0.25); }

    .btn-import {
      background: rgba(56,189,248,0.15);
      border: 1px solid rgba(56,189,248,0.3);
      color: #38bdf8;
      font-size: 11px;
      padding: 6px 10px;
      margin-top: 0;
    }
    .btn-import:hover { background: rgba(56,189,248,0.25); }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-row .btn {
      flex: 1;
      margin-top: 0;
    }

    /* File upload */
    .upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .upload-row .section-title { margin-bottom: 0; flex: 1; }
    .btn-upload {
      padding: 4px 10px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 6px;
      color: #3b82f6;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-upload:hover { background: rgba(59,130,246,0.25); }
    #fileInput { display: none; }

    /* Prompt counter */
    .prompt-count {
      font-size: 11px;
      color: #6b7280;
      text-align: right;
      margin-top: -12px;
      margin-bottom: 12px;
    }
    .prompt-count span { color: #3b82f6; font-weight: 700; }

    /* Progress log */
    .log-container {
      margin-top: 16px;
      max-height: 280px;
      overflow-y: auto;
      border-radius: 8px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.04);
      display: none;
    }
    .log-container.visible { display: block; }

    .log-entry {
      padding: 8px 12px;
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      word-break: break-word;
      line-height: 1.5;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry.done { color: #22c55e; }
    .log-entry.failed { color: #ef4444; }
    .log-entry.generating { color: #3b82f6; }
    .log-entry.downloading { color: #eab308; }
    .log-entry.waiting { color: #6b7280; }
    .log-entry.stopped { color: #f97316; }

    /* Summary bar */
    .summary {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .summary.visible { display: block; }
    .summary.success { background: rgba(34,197,94,0.1); color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }
    .summary.partial { background: rgba(249,115,22,0.1); color: #f97316; border: 1px solid rgba(249,115,22,0.2); }

    /* Divider */
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 16px 0;
    }

    /* Tags */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      max-height: 120px;
      overflow-y: auto;
      padding: 8px;
      background: rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
    }
    .tag {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .tag.done { background: rgba(34,197,94,0.15); color: #22c55e; }
    .tag.failed { background: rgba(239,68,68,0.15); color: #ef4444; }
    .tag.pending { background: rgba(107,114,128,0.2); color: #9ca3af; }
    .tag.skipped { background: rgba(107,114,128,0.1); color: #6b7280; font-style: italic; }
    .tag:hover { filter: brightness(1.2); }
    .tag.selected {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
      background: rgba(59,130,246,0.25);
      color: #60a5fa;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-icon">🎨</div>
    <div>
      <h1>Auto Flow</h1>
      <small>Bulk image generation for Google Flow</small>
    </div>
  </div>

  <!-- Connection Status -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot checking" id="statusDot"></div>
    <span id="statusText">Checking connection...</span>
  </div>

  <!-- Prompt Input -->
  <div class="upload-row">
    <div class="section-title">Prompts (one per line)</div>
    <input type="file" id="fileInput" accept=".txt,.csv,.tsv">
    <button class="btn-upload" id="uploadBtn">📄 Load .txt</button>
  </div>
  <textarea id="promptList" placeholder="A crude, MS Paint style drawing of...&#10;A crude, MS Paint style drawing of...&#10;A crude, MS Paint style drawing of...&#10;&#10;Or click 'Load .txt' to import prompts from a file"></textarea>
  <div class="prompt-count" id="promptCount"></div>

  <!-- Settings -->
  <div class="section-title">Settings</div>
  <div class="row">
    <div>
      <select id="modelSelect">
        <option value="NARWHAL" selected>🍌 Nano Banana 2</option>
        <option value="IMAGEN_3_5">🖼️ Imagen 3.5</option>
      </select>
    </div>
    <div>
      <select id="aspectSelect">
        <option value="IMAGE_ASPECT_RATIO_LANDSCAPE" selected>🖥️ Landscape</option>
        <option value="IMAGE_ASPECT_RATIO_PORTRAIT">📱 Portrait</option>
        <option value="IMAGE_ASPECT_RATIO_SQUARE">⬜ Square</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <select id="namingSelect">
        <option value="number" selected>📁 Name by Number (001, 002...)</option>
        <option value="prompt">📝 Name by Prompt Text</option>
      </select>
    </div>
    <div>
      <select id="conflictSelect">
        <option value="overwrite" selected>🔄 Overwrite (Clean Nums)</option>
        <option value="uniquify">📑 Keep both (Adds (1))</option>
        <option value="prompt">❓ Prompt each time</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <select id="formatSelect">
        <option value="jpeg" selected>🖼️ Format: JPEG</option>
        <option value="png">🎨 Format: PNG</option>
      </select>
    </div>
    <div>
      <input type="text" id="folderInput" value="Flow_Images" placeholder="Save Folder Name" style="margin-bottom: 0;" />
    </div>
  </div>

  <div class="row" style="margin-top: 12px; margin-bottom: 12px;">
    <div style="flex: 1;">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; color: #c9d1d9; user-select: none;">
        <input type="checkbox" id="batchToggle" style="cursor: pointer; width: 16px; height: 16px;">
        <span>⚡ Turn On Batch Mode</span>
      </label>
    </div>
  </div>

  <div id="batchSliderRow" style="display: none; margin-bottom: 16px;">
    <div class="section-title" style="display: flex; justify-content: space-between;">
      <span>Batch Size (Concurrent)</span>
      <span><span id="batchVal">2</span></span>
    </div>
    <input type="range" id="batchSlider" min="2" max="5" value="2" style="width: 100%;">
  </div>

  <div class="row">
    <div style="width: 100%; margin-bottom: 12px;">
      <div class="section-title" style="display: flex; justify-content: space-between;">
        <span>Interval Delay (seconds)</span>
        <span id="delayVal">2s</span>
      </div>
      <input type="range" id="delaySlider" min="1" max="30" value="2" style="width: 100%;">
    </div>
  </div>

  <div class="section-title">Prompt Slicing (1-based index)</div>
  <div class="row">
    <div>
      <input type="number" id="startIndexInput" value="" min="1" placeholder="Start Prompt Index (default: 1)" />
    </div>
    <div>
      <input type="number" id="endIndexInput" value="" min="1" placeholder="End Prompt Index (default: end)" />
    </div>
  </div>

  <!-- Variables -->
  <div class="section-title">Variables (Optional)</div>
  <textarea id="variablesList" placeholder="[noesis] = a stick figure...&#10;[elder] = an old man..." style="height: 100px; margin-bottom: 16px;">[RedEye] = The character has a large, perfectly round white head with very messy, spiky black hair protruding in all directions, drawn using chaotic, sharp straight lines. A jagged, lightning-bolt-shaped crack or scar runs diagonally down the center of the face. The facial features are highly asymmetrical: the left eye is a simple, wide white circle with a tiny black dot for a pupil, while the right eye is an intense, heavily scribbled circle of bright red. There is no visible nose or mouth. The character is wearing a bulky black hoodie. The hoodie is colored using frantic, erratic black scribbles that heavily overlap but leave small, messy gaps of the white background showing through. The arms are thick black sleeves that end in hands made of thin, spindly black stick-lines for fingers. The left arm is slightly bent upwards at the elbow, and the right arm hangs straight down. The legs are drawn as simple, thin black stick lines extending from the bottom of the hoodie, ending in basic, blocky black boots.</textarea>

  <!-- Action Buttons -->
  <button class="btn btn-start" id="startBtn">🚀 Start Generating</button>
  <button class="btn btn-stop" id="stopBtn">⏹ Stop</button>
  <button class="btn btn-retry" id="retryBtn">🔄 Retry Failed</button>
  <button class="btn btn-clear" id="clearBtn">🗑️ Clear All</button>
  <div class="btn-row">
    <button class="btn btn-export" id="exportBtn">📥 Export</button>
    <button class="btn btn-import" id="importBtn">📤 Import</button>
  </div>
  <input type="file" id="importFileInput" accept=".json" style="display: none;">

  <!-- Divider -->
  <div class="divider"></div>

  <!-- Regenerate Section -->
  <div class="section-title" id="regenerateTitle" style="display: none;">Regenerate Specific Images</div>
  <div class="tags-container" id="regenerateTags" style="display: none;"></div>
  <button class="btn btn-retry" id="regenerateBtn" style="display: none; margin-bottom: 16px;">🔄 Regenerate Selected</button>

  <!-- Log -->
  <div class="log-container" id="logContainer"></div>

  <!-- Summary -->
  <div class="summary" id="summary"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
